<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zählerbuch Strom</title>
<meta name="description" content="Stromzähler ablesen, Verbrauch verstehen, Abrechnung vorhersehen, Verträge im Blick. Ohne Konto, die Daten bleiben auf deinem Gerät.">
<meta name="theme-color" content="#f3f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zählerbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Ruhiger App-Stil, verfeinert: helle Fläche, weiße Karten mit weicher Tiefe, große gerundete Zahlen,
   Grün-Türkis als einziger Akzent, Rot/Grün nur für Geld-Ergebnisse. Handy: Tab-Leiste unten. Desktop: Tabs oben, 12er-Raster. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #edf2f0;
  --surface-3: #e3eae7;
  --line: #dfe7e4;
  --fg: #101c19;
  --fg-2: #3f4e49;
  --muted: #66756f;
  --accent: #0e8f7e;
  --accent-strong: #0a6f62;
  --accent-soft: #dbf1eb;
  --accent-ink: #064d44;
  --on-accent: #ffffff;
  --series-2: #e5652c;
  --good: #108048;
  --good-soft: #e0f3e7;
  --bad: #bd3e2a;
  --bad-soft: #fbe7e2;
  --warn: #8c5900;
  --warn-soft: #fcefd3;
  --heat-1: #d3eee7; --heat-2: #9bd8ca; --heat-3: #51b8a4; --heat-4: #17917d; --heat-5: #0a675a;
  --p1: #0e8f7e; --p1s: #dbf1eb; --p2: #3b6fd4; --p2s: #e2ebfb; --p3: #b5562a; --p3s: #fbe9df; --p4: #7a52c7; --p4s: #eee6fb; --p5: #a3790b; --p5s: #f8f0d8; --p6: #c23d6e; --p6s: #fbe4ed;
  --shadow-sm: 0 1px 2px rgb(16 40 34 / 0.05);
  --shadow: 0 1px 2px rgb(16 40 34 / 0.04), 0 8px 24px -6px rgb(16 40 34 / 0.10);
  --shadow-lg: 0 2px 4px rgb(16 40 34 / 0.04), 0 18px 48px -12px rgb(16 40 34 / 0.22);
  --scrim: rgb(8 18 16 / 0.40);
  --radius: 24px;
  --radius-md: 18px;
  --radius-sm: 13px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1211; --surface: #141c1a; --surface-2: #1b2522; --surface-3: #22302c; --line: #25322e; --fg: #e8f0ed; --fg-2: #b6c4bf; --muted: #889893;
    --accent: #36c2aa; --accent-strong: #64d6c2; --accent-soft: #123630; --accent-ink: #9be6d8; --on-accent: #04241e;
    --series-2: #f0844f; --good: #4cc584; --good-soft: #112e1e; --bad: #f2806c; --bad-soft: #371913; --warn: #e6b04c; --warn-soft: #30250d;
    --heat-1: #173631; --heat-2: #1c5a4f; --heat-3: #228070; --heat-4: #2ea891; --heat-5: #62d5c1;
    --p1: #4fd0b9; --p1s: #123630; --p2: #82a8f2; --p2s: #18263f; --p3: #f09a6e; --p3s: #3a2116; --p4: #b79af0; --p4s: #2a2040; --p5: #e2b94c; --p5s: #33290e; --p6: #f08cb2; --p6s: #3a1826;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3); --shadow: 0 1px 2px rgb(0 0 0 / 0.35); --shadow-lg: 0 18px 48px -12px rgb(0 0 0 / 0.6); --scrim: rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1211; --surface: #141c1a; --surface-2: #1b2522; --surface-3: #22302c; --line: #25322e; --fg: #e8f0ed; --fg-2: #b6c4bf; --muted: #889893;
  --accent: #36c2aa; --accent-strong: #64d6c2; --accent-soft: #123630; --accent-ink: #9be6d8; --on-accent: #04241e;
  --series-2: #f0844f; --good: #4cc584; --good-soft: #112e1e; --bad: #f2806c; --bad-soft: #371913; --warn: #e6b04c; --warn-soft: #30250d;
  --heat-1: #173631; --heat-2: #1c5a4f; --heat-3: #228070; --heat-4: #2ea891; --heat-5: #62d5c1;
  --p1: #4fd0b9; --p1s: #123630; --p2: #82a8f2; --p2s: #18263f; --p3: #f09a6e; --p3s: #3a2116; --p4: #b79af0; --p4s: #2a2040; --p5: #e2b94c; --p5s: #33290e; --p6: #f08cb2; --p6s: #3a1826;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3); --shadow: 0 1px 2px rgb(0 0 0 / 0.35); --shadow-lg: 0 18px 48px -12px rgb(0 0 0 / 0.6); --scrim: rgb(0 0 0 / 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; }
a { color: var(--accent-strong); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.78rem; font-weight: 650; color: var(--muted); letter-spacing: 0.02em; }

/* ---------- Gerüst ---------- */
.app { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
.appbar { display: flex; align-items: center; gap: 12px; padding-block: 10px 20px; }
.appbar .hello { flex: 1; min-width: 0; }
.appbar h1 { font-size: 2rem; font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
.appbar .sub { color: var(--muted); font-size: 0.92rem; margin-top: 3px; }
.round-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; color: var(--fg-2); flex: none; transition: transform .15s var(--ease); }
.round-btn:active { transform: scale(.94); }
.toptabs { display: none; }
.btn.read-top { display: none; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.8) blur(18px); -webkit-backdrop-filter: saturate(1.8) blur(18px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(6px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-right)); }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 0.68rem; font-weight: 650; color: var(--muted); cursor: pointer; border-radius: 12px; position: relative; }
.tab svg { width: 24px; height: 24px; transition: transform .2s var(--ease); }
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"] svg { transform: translateY(-1px) scale(1.06); }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--series-2); box-shadow: 0 0 0 2px var(--surface); }
.fab { position: fixed; z-index: 21; right: max(16px, env(safe-area-inset-right)); bottom: calc(80px + env(safe-area-inset-bottom)); border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 1rem; padding: 15px 22px 15px 18px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 10px 26px -6px color-mix(in srgb, var(--accent) 60%, transparent); cursor: pointer; transition: transform .15s var(--ease); }
.fab:active { transform: scale(0.96); }

@media (min-width: 900px) {
  .app { padding-bottom: 56px; padding-top: 22px; }
  .tabbar, .fab { display: none; }
  .appbar { flex-wrap: wrap; justify-content: space-between; row-gap: 18px; }
  .appbar .hello { flex: 1 1 calc(100% - 60px); order: 1; }
  .appbar .round-btn { order: 2; }
  .appbar h1 { font-size: 2.3rem; }
  .toptabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; order: 3; }
  .toptabs .tab { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; font-size: 0.92rem; border-radius: 999px; }
  .toptabs .tab svg { width: 18px; height: 18px; }
  .toptabs .tab .badge { top: 8px; left: 26px; }
  .toptabs .tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
  .btn.read-top { display: inline-flex; order: 4; }
}

/* ---------- Karten & Raster ---------- */
.panel { display: grid; gap: 16px; }
.panel.enter { animation: rise .35s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.cols { display: grid; gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start; }
@media (min-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cols.wide { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
  .cols > .span { grid-column: 1 / -1; }
}
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.card h2 { font-size: 1.12rem; font-weight: 720; }
.card h3 { font-size: 1rem; font-weight: 680; }
.section-title { font-size: 1.35rem; font-weight: 750; padding: 14px 4px 0; letter-spacing: -0.02em; }
.section-sub { color: var(--muted); padding: 0 4px; margin-top: -10px; font-size: 0.92rem; }
.link-btn { border: 0; background: none; color: var(--accent-strong); font-weight: 650; cursor: pointer; padding: 4px 0; font-size: 0.92rem; display: inline-flex; align-items: center; gap: 4px; }
.divider { height: 1px; background: var(--line); margin-inline: -20px; }

/* Hero */
.hero { padding: 24px; gap: 18px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 12%, transparent), transparent); pointer-events: none; }
.hero.bill::after { background: radial-gradient(closest-side, color-mix(in srgb, var(--hero-tint, var(--accent)) 14%, transparent), transparent); }
.hero-amount { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 750; font-size: clamp(3.1rem, 13vw, 4.6rem); line-height: 0.95; letter-spacing: -0.035em; }
.hero-amount.mid { font-size: clamp(2.3rem, 9vw, 3rem); }
.hero-amount .approx { font-weight: 500; opacity: .55; margin-right: 2px; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.hero-text { color: var(--fg-2); max-width: 62ch; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 0.8rem; font-weight: 650; background: var(--surface-2); color: var(--fg-2); justify-self: start; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.breakdown > div { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; gap: 1px; min-width: 0; }
.breakdown .k { font-size: 0.78rem; color: var(--muted); }
.breakdown .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
@media (max-width: 480px) { .breakdown { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .breakdown > div:last-child:nth-child(odd) { grid-column: 1 / -1; } }

/* Prognose-Band */
.band { display: grid; gap: 8px; }
.band-track { position: relative; height: 36px; }
.band-axis { position: absolute; left: 0; right: 0; top: 15px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--bad-soft) 0 50%, var(--good-soft) 50% 100%); }
.band-zero { position: absolute; top: 6px; width: 2px; height: 24px; background: var(--fg-2); border-radius: 1px; transform: translateX(-1px); opacity: .5; }
.band-range { position: absolute; top: 11px; height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--fg) 14%, transparent); }
.band-dot { position: absolute; top: 8px; width: 20px; height: 20px; border-radius: 50%; transform: translateX(-10px); border: 3px solid var(--surface); box-shadow: var(--shadow); }
.band-labels { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--muted); }
.band-labels b { font-weight: 650; }
@media (prefers-reduced-motion: no-preference) { .band-dot, .band-range { transition: left .6s var(--ease), width .6s var(--ease); } }

.spark { display: grid; grid-template-columns: repeat(12, 1fr); align-items: end; gap: 5px; height: 58px; }
.spark i { display: block; border-radius: 6px 6px 3px 3px; background: var(--accent); min-height: 3px; transform-origin: bottom; }
.spark i.est { background: repeating-linear-gradient(135deg, var(--accent-soft) 0 3px, color-mix(in srgb, var(--accent) 35%, var(--accent-soft)) 3px 6px); }
@media (prefers-reduced-motion: no-preference) { .panel.enter .spark i { animation: grow .6s var(--ease) both; } }
@keyframes grow { from { transform: scaleY(0.1); } to { transform: none; } }
.spark-labels { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; font-size: 0.66rem; color: var(--muted); text-align: center; margin-top: -10px; }
.meterline { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--muted); flex-wrap: wrap; }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; position: relative; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 15px 16px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.tile .ic { width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; margin-bottom: 6px; }
.tile .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 1.55rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
.tile .v small { font-size: 0.88rem; font-weight: 650; color: var(--fg-2); margin-left: 3px; letter-spacing: 0; }
.tile .k { font-size: 0.8rem; color: var(--muted); }

.notice { display: flex; gap: 14px; align-items: center; padding: 15px 18px; border-radius: var(--radius-md); }
.notice.accent { background: var(--accent-soft); }
.notice.warn { background: var(--warn-soft); }
.notice.bad { background: var(--bad-soft); }
.notice .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--surface); flex: none; color: var(--accent); box-shadow: var(--shadow-sm); }
.notice.warn .ico { color: var(--warn); }
.notice.bad .ico { color: var(--bad); }
.notice .txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.notice .txt b { font-weight: 700; }
.notice .txt span { color: var(--fg-2); font-size: 0.9rem; }
@media (max-width: 520px) { .notice { flex-wrap: wrap; } .notice > .btn { width: 100%; } }

/* Buttons & Formulare */
.btn { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 680; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface-2); color: var(--fg); text-decoration: none; transition: transform .12s var(--ease), filter .15s; white-space: nowrap; }
.btn:hover { filter: brightness(0.97); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.soft { background: var(--accent-soft); color: var(--accent-ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 13px; font-size: 0.85rem; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 0.86rem; font-weight: 650; color: var(--fg-2); }
.field .help { font-size: 0.8rem; color: var(--muted); }
.input { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 13px; padding: 11px 13px; font-size: 1rem; appearance: none; -webkit-appearance: none; transition: border-color .15s, box-shadow .15s; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.input.big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 750; letter-spacing: 0.02em; padding: 12px 14px; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.unit { position: relative; }
.unit .input { padding-right: 70px; }
.unit span { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.86rem; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .grid3 > :last-child:nth-child(odd) { grid-column: 1 / -1; } }
@media (max-width: 420px) { .grid2.wrap { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 13px; gap: 2px; flex-wrap: wrap; justify-self: start; }
.seg button { border: 0; background: none; padding: 8px 13px; border-radius: 10px; font-size: 0.9rem; font-weight: 650; color: var(--fg-2); cursor: pointer; transition: background .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
.msg { font-size: 0.9rem; padding: 10px 12px; border-radius: 12px; }
.msg.err { background: var(--bad-soft); color: var(--bad); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.ok { background: var(--good-soft); color: var(--good); }
.preview { font-size: 0.9rem; color: var(--fg-2); min-height: 1.3em; }
.form-section { display: grid; gap: 12px; }
.form-section > h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }

/* Listen */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .main { flex: 1; min-width: 0; display: grid; }
.li .main b { font-weight: 650; }
.li .main span { font-size: 0.84rem; color: var(--muted); }
.li .end { text-align: right; display: grid; flex: none; }
.li .end b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; }
.li .end span { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.icon-btn { width: 38px; height: 38px; border-radius: 11px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.danger:hover { color: var(--bad); background: var(--bad-soft); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bad-soft); border-radius: 12px; margin-block: 6px; }
.daydot { width: 42px; height: 42px; border-radius: 13px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 750; font-size: 0.84rem; line-height: 1.05; text-align: center; flex: none; font-variant-numeric: tabular-nums; }
.daydot small { font-weight: 650; font-size: 0.6rem; display: block; }

/* Anbieter */
.avatar { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 1.02rem; letter-spacing: -0.02em; flex: none; background: var(--ps); color: var(--pc); }
.avatar.lg { width: 58px; height: 58px; border-radius: 18px; font-size: 1.25rem; }
.avatar.sm { width: 34px; height: 34px; border-radius: 11px; font-size: 0.82rem; }
.contract-head { display: flex; gap: 14px; align-items: center; min-width: 0; }
.contract-head .t { min-width: 0; display: grid; gap: 1px; flex: 1; }
.contract-head h2 { font-size: 1.3rem; overflow-wrap: anywhere; }
.contract-head .sub { color: var(--muted); font-size: 0.9rem; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.facts > div { background: var(--surface-2); padding: 12px 14px; display: grid; gap: 1px; min-width: 0; }
.facts .k { font-size: 0.78rem; color: var(--muted); }
.facts .v { font-weight: 700; font-family: var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (min-width: 640px) { .facts.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.term { display: grid; gap: 8px; }
.term-bar { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); }
.term-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.term-bar .dl { position: absolute; top: -5px; width: 3px; height: 20px; border-radius: 2px; background: var(--series-2); transform: translateX(-1px); }
.term-labels { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); gap: 8px; }
.countdown { display: flex; gap: 16px; align-items: center; padding: 14px; border-radius: var(--radius-md); background: var(--surface-2); }
.countdown.warn { background: var(--warn-soft); }
.countdown.bad { background: var(--bad-soft); }
.countdown .ring { position: relative; width: 74px; height: 74px; flex: none; }
.countdown .ring svg { width: 74px; height: 74px; transform: rotate(-90deg); }
.countdown .ring span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: var(--font-num); font-weight: 800; font-size: 1.25rem; line-height: 1; font-variant-numeric: tabular-nums; }
.countdown .ring span small { font-size: 0.6rem; font-weight: 650; color: var(--muted); font-family: var(--font); margin-top: 3px; }
.countdown .txt { display: grid; gap: 2px; min-width: 0; flex: 1; }
.countdown .txt b { font-weight: 700; }
.countdown .txt span { font-size: 0.88rem; color: var(--fg-2); }
.copyrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }

.copyrow .v { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

/* Checkliste */
.checklist { display: grid; gap: 2px; }
.ck-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ck-head .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.ck-head .who > div:last-child { display: grid; min-width: 0; }
.switch-row { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ck { display: flex; gap: 12px; align-items: flex-start; padding: 10px 6px; border-radius: 12px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.ck:hover { background: var(--surface-2); }
.ck .box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: transparent; transition: background .2s, border-color .2s, color .2s; margin-top: 1px; }
.ck[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ck[aria-checked="true"] .box svg { animation: pop .3s var(--ease); }
@keyframes pop { from { transform: scale(.3); } to { transform: none; } }
.ck .t { display: grid; gap: 1px; min-width: 0; }
.ck .t b { font-weight: 620; }
.ck[aria-checked="true"] .t b { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.ck .t span { font-size: 0.82rem; color: var(--muted); }
.ring-sm { width: 46px; height: 46px; flex: none; position: relative; }
.ring-sm svg { width: 46px; height: 46px; transform: rotate(-90deg); }
.ring-sm span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 800; font-family: var(--font-num); }

/* Zeitstrahl */
.timeline { display: grid; position: relative; }
.tl { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 20px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 22px; top: 50px; bottom: 2px; width: 2px; background: var(--line); border-radius: 1px; }
.tl:last-child::before { display: none; }
.tl .body { display: grid; gap: 8px; min-width: 0; padding-top: 2px; }
.tl .row1 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.tl .row1 b { font-weight: 700; font-size: 1.02rem; }
.tl .meta { font-size: 0.84rem; color: var(--muted); }
.tl .stats { display: flex; flex-wrap: wrap; gap: 6px; }
.tl .stats span { font-size: 0.8rem; background: var(--surface-2); padding: 4px 9px; border-radius: 8px; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.pricebar { display: grid; grid-template-columns: 56px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 0.84rem; }

/* Diagramme */

.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.chart text.val { fill: var(--fg-2); font-weight: 650; }
.chart text.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.gl { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.sw.line { height: 3px; width: 16px; border-radius: 2px; }

.empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 0.92rem; background: var(--surface-2); border-radius: var(--radius-sm); display: grid; gap: 8px; justify-items: center; }
.empty svg { color: var(--accent); opacity: .8; }
.scroll-x { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }

.scale { position: relative; height: 14px; border-radius: 7px; display: flex; overflow: hidden; }
.scale i { display: block; height: 100%; }
.scale-wrap { position: relative; padding-top: 34px; padding-bottom: 22px; }

.scale-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
.big-stat { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 2.2rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }

.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; width: max-content; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); display: block; }
.heat-legend { display: flex; gap: 4px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: block; }
.heat-months { display: grid; grid-auto-flow: column; gap: 3px; font-size: 0.7rem; color: var(--muted); width: max-content; height: 16px; }

/* Dialoge */
dialog { border: 0; padding: 0; background: var(--surface); color: var(--fg); max-width: none; max-height: none; }
dialog::backdrop { background: var(--scrim); backdrop-filter: blur(2px); }
.sheet { width: min(540px, 100%); margin: auto auto 0; border-radius: 28px 28px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }

@media (min-width: 600px) { .sheet { margin: auto; border-radius: 28px; padding: 24px; } .sheet .grab { display: none; } }

.dots { display: flex; gap: 6px; }

.dots i.on { width: 24px; background: var(--accent); }
.guide-body h2 { font-size: 1.65rem; font-weight: 760; letter-spacing: -0.025em; }
.guide-body p { color: var(--fg-2); }
.guide-art { height: 150px; border-radius: 24px; background: var(--accent-soft); display: grid; place-items: center; position: relative; overflow: hidden; }

.check .n { width: 30px; height: 30px; border-radius: 10px; background: var(--surface); color: var(--accent); display: grid; place-items: center; font-weight: 750; flex: none; }
.check div { display: grid; gap: 2px; }

.price-row { display: grid; gap: 10px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 11px 18px 11px 14px; border-radius: 999px; font-size: 0.92rem; font-weight: 650; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); z-index: 50; max-width: calc(100% - 32px); display: inline-flex; gap: 8px; align-items: center; box-shadow: var(--shadow-lg); }

<script>
'use strict';
// ================= Datum =================
const DAY = 86400000;
const dn = s => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / DAY);
const ds = n => new Date(n * DAY).toISOString().slice(0, 10);
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && ds(dn(s)) === s;
function addMonths(s, m) {
  const y = +s.slice(0, 4), mo = +s.slice(5, 7) - 1 + m, d = +s.slice(8, 10);
  const first = new Date(Date.UTC(y, mo, 1));
  const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  first.setUTCDate(Math.min(d, last));
  return first.toISOString().slice(0, 10);
}
const todayStr = () => { const t = new Date(); return ds(Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY)); };
const uid = () => Math.random().toString(36).slice(2, 10);

// ================= Datenmodell =================
// Version 3: Verträge mit Preisen, Laufzeit, Kündigungsfrist, Bonus, Nummern, Kontakt, Checkliste.
const str = (v, n = 120) => typeof v === 'string' ? v.trim().slice(0, n) : '';
const okNum = v => typeof v === 'number' && isFinite(v) && v >= 0;
function cleanPrices(list) {
  const seen = new Set();
  return (Array.isArray(list) ? list : [])
    .filter(t => t && isDate(t.ab) && okNum(t.arbeitspreis) && okNum(t.grundpreis) && okNum(t.abschlag))
    .filter(t => !seen.has(t.ab) && seen.add(t.ab))
    .map(t => ({ ab: t.ab, arbeitspreis: t.arbeitspreis, grundpreis: t.grundpreis, abschlag: t.abschlag }))
    .sort((a, b) => a.ab < b.ab ? -1 : 1);
}
// Sofortbonus (wird ausgezahlt) und Neukundenbonus (mit der Jahresrechnung) können beide vorkommen.
// Ältere Daten hatten nur einen Bonus mit "art"; der wird in das passende Feld übernommen.
function normBonus(b, checks) {
  const one = x => ({ betrag: okNum(x?.betrag) ? x.betrag : 0, erhalten: isDate(x?.erhalten) ? x.erhalten : null });
  if (b.sofort || b.neukunde) return { sofort: one(b.sofort), neukunde: one(b.neukunde) };
  const old = one(b), art = b.art === 'sofort' ? 'sofort' : 'neukunde';
  if (checks.bonus) { checks[art === 'sofort' ? 'sofortbonus' : 'neubonus'] = checks.bonus; delete checks.bonus; }
  return { sofort: art === 'sofort' ? old : one(null), neukunde: art === 'neukunde' ? old : one(null) };
}
const bonusTotal = c => c.bonus.sofort.betrag + c.bonus.neukunde.betrag;
function cleanContract(c) {
  const preise = cleanPrices(c.preise);
  if (!preise.length) return null;
  const beginn = isDate(c.beginn) ? c.beginn : preise[0].ab;
  preise[0] = { ...preise[0], ab: beginn };
  const f = c.frist || {};
  const b = c.bonus || {};
  const k = c.kontakt || {};
  const checks = {};
  if (c.checks && typeof c.checks === 'object') for (const [key, v] of Object.entries(c.checks)) if (/^[a-z]{2,20}$/.test(key) && isDate(v)) checks[key] = v;
  return {
    id: typeof c.id === 'string' && /^[a-z0-9]{4,16}$/.test(c.id) ? c.id : uid(),
    anbieter: str(c.anbieter, 60), tarif: str(c.tarif, 60),
    beginn, ende: isDate(c.ende) && c.ende > beginn ? c.ende : null,
    frist: { wert: Number.isInteger(f.wert) && f.wert >= 0 && f.wert <= 52 ? f.wert : null, einheit: ['wochen', 'monate', 'tage'].includes(f.einheit) ? f.einheit : 'wochen' },
    preisgarantie: isDate(c.preisgarantie) ? c.preisgarantie : null,
    bonus: normBonus(b, checks),
    kundennr: str(c.kundennr, 40), vertragsnr: str(c.vertragsnr, 40), zaehlernr: str(c.zaehlernr, 40),
    kontakt: { web: str(k.web, 200), tel: str(k.tel, 40), mail: str(k.mail, 120) },
    notiz: str(c.notiz, 1000),
    checks, preise,
  };
}
function sanitize(o) {
  if (!o || typeof o !== 'object') throw new Error('Das ist keine Zählerbuch-Sicherung.');
  const seen = new Set();
  const readings = (Array.isArray(o.readings) ? o.readings : [])
    .filter(r => r && isDate(r.datum) && okNum(r.stand))
    .filter(r => !seen.has(r.datum) && seen.add(r.datum))
    .map(r => ({ datum: r.datum, stand: r.stand }))
    .sort((a, b) => a.datum < b.datum ? -1 : 1);
  let vertraege;
  if (Array.isArray(o.vertraege)) vertraege = o.vertraege.map(c => c && cleanContract(c)).filter(Boolean);
  else {
    // Ältere Versionen: Tarifzeilen. Zeilen, die auf einen Abrechnungsjahres-Beginn fallen, werden eigene Verträge.
    const tarife = cleanPrices(o.tarife);
    const anchor = isDate(o.vertrag?.abrechnungsbeginn) ? o.vertrag.abrechnungsbeginn : tarife[0]?.ab;
    vertraege = [];
    const onAnchor = d => { for (let k = -30; k <= 30; k++) if (addMonths(anchor, 12 * k) === d) return true; return false; };
    tarife.forEach((t, i) => {
      if (i === 0 || onAnchor(t.ab)) vertraege.push(cleanContract({ beginn: t.ab, preise: [t] }));
      else vertraege[vertraege.length - 1].preise.push(t);
    });
    if (vertraege.length && anchor && anchor < vertraege[0].beginn) { vertraege[0].beginn = anchor; vertraege[0].preise[0].ab = anchor; }
  }
  const bySeen = new Set();
  vertraege = vertraege.filter(c => !bySeen.has(c.beginn) && bySeen.add(c.beginn)).sort((a, b) => a.beginn < b.beginn ? -1 : 1);
  if (!vertraege.length) throw new Error('In der Datei fehlt der Stromvertrag.');
  const p = o.profil || {}, z = o.ziel || {}, er = o.erinnerung || {};
  return {
    version: 3,
    profil: { name: str(p.name, 40), personen: [1, 2, 3, 4, 5].includes(p.personen) ? p.personen : 2, wohnform: p.wohnform === 'haus' ? 'haus' : 'wohnung', co2: okNum(p.co2) ? p.co2 : 363 },
    ziel: { kwh: okNum(z.kwh) && z.kwh > 0 ? z.kwh : null },
    erinnerung: { intervall: ['monat', 'woche', '2wochen'].includes(er.intervall) ? er.intervall : 'monat' },
    meta: { letzteSicherung: isDate(o.meta?.letzteSicherung) ? o.meta.letzteSicherung : null },
    vertraege, readings,
  };
}

// ================= Rechenkern =================
function buildModel(state) {
  const R = state.readings.map(r => ({ ...r, d: dn(r.datum) })).sort((a, b) => a.d - b.d);
  const C = state.vertraege.map(c => ({ ...c, d: dn(c.beginn), P: c.preise.map(p => ({ ...p, d: dn(p.ab) })).sort((a, b) => a.d - b.d) })).sort((a, b) => a.d - b.d);
  const iv = [];
  for (let i = 0; i + 1 < R.length; i++) {
    const a = R[i], b = R[i + 1], kwh = b.stand - a.stand;
    iv.push({ a: a.d, b: b.d, kwh, rate: kwh / (b.d - a.d), from: a, to: b });
  }
  const first = R.length ? R[0].d : null, last = R.length ? R[R.length - 1].d : null;
  function rateAt(d) {
    let lo = 0, hi = iv.length - 1;
    while (lo <= hi) { const m = (lo + hi) >> 1, x = iv[m]; if (d < x.a) hi = m - 1; else if (d >= x.b) lo = m + 1; else return x.rate; }
    return null;
  }
  function meterAt(d) {
    if (!R.length || d < first || d > last) return null;
    for (const x of iv) if (d >= x.a && d <= x.b) return x.from.stand + x.rate * (d - x.a);
    return R[0].stand;
  }
  function contractAt(d) { let c = C[0]; for (const x of C) if (x.d <= d) c = x; else break; return c; }
  function tarifAt(d) { const c = contractAt(d); let t = c.P[0]; for (const x of c.P) if (x.d <= d) t = x; else break; return t; }
  let avgRate = null;
  if (iv.length) { const span = Math.min(365, last - first); avgRate = (meterAt(last) - meterAt(last - span)) / span; }
  function estimate(d) {
    for (const back of [-12, -24]) { const r = rateAt(dn(addMonths(ds(d), back))); if (r != null) return { r, how: 'vorjahr' }; }
    return avgRate != null ? { r: avgRate, how: 'schnitt' } : null;
  }
  return { R, C, iv, first, last, rateAt, meterAt, contractAt, tarifAt, avgRate, estimate };
}
// Abrechnungsjahre: je Vertrag in 12-Monats-Schritten ab Vertragsbeginn, bis der nächste Vertrag beginnt.
function listPeriods(M) {
  const today = dn(todayStr());
  const endD = Math.max(M.last ?? today, today), startD = M.first ?? today;
  const out = [];
  M.C.forEach((c, i) => {
    if (c.d > endD) return;
    const limit = M.C[i + 1] && M.C[i + 1].d <= endD + 400 ? M.C[i + 1].beginn : null;
    let s = c.beginn;
    while (dn(s) <= endD && (!limit || s < limit)) {
      let e = addMonths(s, 12);
      if (limit && e > limit) e = limit;
      out.push({ S: s, E: e, cid: c.id });
      s = e;
    }
  });
  const relevant = out.filter(p => dn(p.E) > startD);
  return relevant.length ? relevant : out.slice(-1);
}
function calcPeriod(M, per) {
  const { S, E } = per, s = dn(S), e = dn(E);
  const contract = M.C.find(c => c.id === per.cid);
  const months = new Map();
  let kwhKnown = 0, kwhEst = 0, costEnergy = 0, costGrund = 0, knownDays = 0, missing = false, estCost = 0;
  const hows = new Set(), cum = [];
  for (let d = s; d < e; d++) {
    const key = ds(d).slice(0, 7);
    if (!months.has(key)) months.set(key, { key, known: 0, est: 0, days: 0, knownDays: 0 });
    const mo = months.get(key);
    mo.days++;
    let r = null, known = false;
    if (M.first != null && d >= M.first && d < M.last) { r = M.rateAt(d); known = r != null; }
    let how = null;
    if (!known) { const est = M.estimate(d); if (est) { r = est.r; how = est.how; hows.add(how); } else missing = true; }
    const t = M.tarifAt(d);
    costGrund += t.grundpreis * 12 / 365;
    if (r != null) {
      const ce = r * t.arbeitspreis / 100;
      costEnergy += ce;
      if (known) { kwhKnown += r; mo.known += r; knownDays++; mo.knownDays++; }
      else { kwhEst += r; mo.est += r; estCost += ce * (how === 'vorjahr' ? 0.10 : 0.18); }
    }
    cum.push({ d, cost: costEnergy + costGrund, known });
  }
  let abschlaege = 0;
  const abschlagSteps = [];
  for (let m = 0; m < 12; m++) {
    const md = addMonths(S, m);
    if (md >= E) break;
    abschlaege += M.tarifAt(dn(md)).abschlag;
    abschlagSteps.push({ d: dn(md), sum: abschlaege });
  }
  // Bonus zählt im ersten Abrechnungsjahr eines Vertrags. Neukundenbonus wird mit der Rechnung verrechnet, Sofortbonus separat ausgezahlt.
  const firstYear = contract && contract.beginn === S;
  const bonus = firstYear ? bonusTotal(contract) : 0;
  const bonusInBill = firstYear ? contract.bonus.neukunde.betrag : 0;
  const cost = costEnergy + costGrund;
  const diff = abschlaege - cost + bonusInBill;
  const totalDays = e - s;
  return {
    S, E, s, e, cid: per.cid, contract, totalDays, knownDays, complete: knownDays === totalDays,
    kwhKnown, kwhEst, kwh: kwhKnown + kwhEst, costEnergy, costGrund, cost, bonus, bonusInBill,
    netCost: cost - bonus, abschlaege, diff, unsicher: estCost, lo: diff - estCost, hi: diff + estCost,
    fitAbschlag: Math.ceil(Math.max(0, cost - bonusInBill) / Math.max(1, abschlagSteps.length)),
    months: [...months.values()], cum, abschlagSteps,
    how: hows.has('vorjahr') && hows.has('schnitt') ? 'mix' : hows.has('vorjahr') ? 'vorjahr' : hows.has('schnitt') ? 'schnitt' : null,
    noForecast: missing || M.iv.length === 0,
    sicherheit: knownDays / totalDays >= 0.65 ? 'hoch' : knownDays / totalDays >= 0.25 ? 'mittel' : 'niedrig',
  };
}
// Kündigung muss bis zu diesem Tag beim Anbieter sein.
function kuendigenBis(c) {
  if (!c.ende || c.frist.wert == null) return null;
  const base = ds(dn(c.ende) + 1);
  const f = c.frist;
  const x = f.einheit === 'monate' ? addMonths(base, -f.wert) : ds(dn(base) - f.wert * (f.einheit === 'wochen' ? 7 : 1));
  return ds(dn(x) - 1);
}
function currentContract(M) { const t = dn(todayStr()); const past = M.C.filter(c => c.d <= t); return past.length ? past[past.length - 1] : M.C[0]; }
function upcomingContract(M) { const t = dn(todayStr()); return M.C.find(c => c.d > t) || null; }

// ---- Statistiken ----
function calendarMonths(M) {
  if (M.iv.length === 0) return [];
  const out = new Map();
  for (let d = M.first; d < M.last; d++) {
    const k = ds(d).slice(0, 7);
    if (!out.has(k)) out.set(k, { key: k, kwh: 0, knownDays: 0, days: dn(addMonths(k + '-01', 1)) - dn(k + '-01') });
    const m = out.get(k); m.kwh += M.rateAt(d); m.knownDays++;
  }
  return [...out.values()].map(m => ({ ...m, complete: m.knownDays === m.days, perDay: m.kwh / m.knownDays }));
}
function rollingYear(M) {
  if (M.iv.length === 0 || M.last - M.first < 365) return [];
  const pts = [];
  const f = ds(M.first + 365);
  let s = f.slice(8) === '01' ? f : addMonths(f.slice(0, 7) + '-01', 1);
  while (dn(s) <= M.last) { const e = dn(s); pts.push({ d: e, key: s, kwh: M.meterAt(e) - M.meterAt(e - 365) }); s = addMonths(s, 1); }
  if (!pts.length || pts[pts.length - 1].d !== M.last) pts.push({ d: M.last, key: ds(M.last), kwh: M.meterAt(M.last) - M.meterAt(M.last - 365) });
  return pts;
}
function yearBasis(M, cur) {
  if (M.iv.length && M.last - M.first >= 365) return { kwh: M.meterAt(M.last) - M.meterAt(M.last - 365), how: 'gemessen in den letzten 12 Monaten' };
  if (cur && !cur.noForecast) return { kwh: cur.kwh * 365 / cur.totalDays, how: 'hochgerechnet aufs Jahr' };
  return null;
}
const RICHTWERTE = { wohnung: [1400, 2200, 2800, 3300, 3800], haus: [2000, 3000, 3600, 4200, 5000] };
const richtwert = p => RICHTWERTE[p.wohnform === 'haus' ? 'haus' : 'wohnung'][Math.min(5, Math.max(1, p.personen)) - 1];
function seasons(M) {
  if (M.iv.length === 0) return null;
  const from = Math.max(M.first, M.last - 365);
  let s = 0, sn = 0, w = 0, wn = 0;
  for (let d = from; d < M.last; d++) { const mo = +ds(d).slice(5, 7), r = M.rateAt(d); if (mo >= 4 && mo <= 9) { s += r; sn++; } else { w += r; wn++; } }
  return { summer: sn ? s / sn : null, winter: wn ? w / wn : null, sn, wn };
}
function nextDue(state, M) {
  const iv = state.erinnerung.intervall;
  if (!M.R.length) return todayStr();
  const last = M.R[M.R.length - 1].datum;
  if (iv === 'woche') return ds(dn(last) + 7);
  if (iv === '2wochen') return ds(dn(last) + 14);
  return addMonths(last.slice(0, 7) + '-01', 1);
}

// ---- Wechsel-Checkliste ----
const CHECKS = [
  { k: 'abschluss', t: 'Neuen Vertrag abgeschlossen', h: 'Auftragsbestätigung aufheben.' },
  { k: 'kuendigung', t: 'Alten Vertrag gekündigt', h: 'Oder bestätigt, dass der neue Anbieter für dich kündigt.' },
  { k: 'lieferbeginn', t: 'Lieferbeginn bestätigt', h: 'Der neue Anbieter nennt das genaue Datum.' },
  { k: 'ablesung', t: 'Zählerstand am Wechseltag eingetragen', h: 'Wird automatisch erkannt, wenn du um den Wechseltag abliest.', auto: true },
  { k: 'gemeldet', t: 'Zählerstand an beide Anbieter gemeldet', h: 'Schützt dich vor geschätzten Werten in der Rechnung.' },
  { k: 'lastschrift', t: 'Alte Abschläge gestoppt, neue laufen', h: 'Kontoauszug prüfen.' },
  { k: 'schluss', t: 'Schlussrechnung des alten Anbieters geprüft', h: 'Mit dem Ergebnis im Zählerbuch vergleichen.' },
  { k: 'sofortbonus', t: 'Sofortbonus erhalten', h: 'Kommt meist einige Wochen nach Lieferbeginn aufs Konto.', bonus: 'sofort' },
  { k: 'neubonus', t: 'Neukundenbonus verrechnet', h: 'Kommt meist mit der ersten Jahresrechnung.', bonus: 'neukunde' },
];
function checklistFor(M, c) {
  const items = CHECKS.filter(x => !x.bonus || c.bonus[x.bonus].betrag > 0).map(x => {
    let done = !!c.checks[x.k], auto = false;
    if (x.k === 'ablesung' && !done) { const hit = M.R.find(r => Math.abs(r.d - c.d) <= 3); if (hit) { done = true; auto = true; } }
    if (x.bonus && !done && c.bonus[x.bonus].erhalten) done = true;
    return { ...x, done, auto };
  });
  return { items, done: items.filter(i => i.done).length, total: items.length };
}

// ---- Eingabe ----
function parseNum(v) {
  let s = String(v ?? '').trim().replace(/\s/g, '').replace(/€|ct|kwh/gi, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}

function sampleState() {
  const start = dn('2024-03-02'), end = dn('2026-10-03');
  const rate = d => { const doy = d - dn(ds(d).slice(0, 4) + '-01-01'); return 6.1 + 1.9 * Math.cos(2 * Math.PI * (doy - 20) / 365) - (d > dn('2025-09-01') ? 0.35 : 0); };
  const readings = [];
  let stand = 31480, d = start, i = 0, acc = 0;
  readings.push({ datum: ds(d), stand });
  while (d < end) {
    const next = Math.min(end, dn(addMonths(ds(d).slice(0, 7) + '-01', 1)) + ((i * 7) % 5));
    for (let x = d; x < next; x++) acc += rate(x);
    stand += Math.round(acc); acc -= Math.round(acc); d = next; i++;
    readings.push({ datum: ds(d), stand });
  }
  readings.push({ datum: '2025-03-01', stand: 33910 });
  return sanitize({
    profil: { name: 'Alex', personen: 2, wohnform: 'wohnung' },
    ziel: { kwh: 2100 },

// ================= Format & Helfer =================
const fmtN = (v, d = 0) => v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtEur = (v, d = 2) => fmtN(v, d) + ' €';
const fmtKwh = v => fmtN(Math.round(v)) + ' kWh';
const fmtD = s => s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4);
const fmtDs = s => s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(2, 4);
const signEur = (v, d = 0) => (v >= 0 ? '+' : '−') + fmtN(Math.abs(v), d) + ' €';
const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const MONL = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const WTAG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const monLabel = k => MON[+k.slice(5, 7) - 1];
const standFmt = v => fmtN(v, v % 1 ? 1 : 0);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, s = 20) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
function showMsg(el, text, cls) { if (!el) return; el.textContent = text || ''; el.className = 'msg ' + (cls || ''); el.hidden = !text; }
let toastT;
function toast(t) { const el = $('toast'); el.innerHTML = icon('check', 18) + `<span>${esc(t)}</span>`; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
const daysBetween = (a, b) => dn(b) - dn(a);
const relDays = n => n === 0 ? 'heute' : n === 1 ? 'morgen' : n === -1 ? 'gestern' : n > 0 ? `in ${n} Tagen` : `vor ${-n} Tagen`;
const periodLabel = p => p.S.slice(2, 4) + '/' + ds(dn(p.E) - 1).slice(2, 4);
const contractName = c => c.anbieter || 'Stromvertrag ab ' + fmtDs(c.beginn);
function initials(c) { const n = (c.anbieter || 'Strom').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/); return ((n[0] || 'S')[0] + (n[1] ? n[1][0] : (n[0][1] || ''))).toUpperCase(); }
function hue(c) { let h = 0; for (const ch of (c.anbieter || c.beginn)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return 1 + h % 6; }
const avatar = (c, size = '') => `<div class="avatar ${size}" style="--pc:var(--p${hue(c)});--ps:var(--p${hue(c)}s)" aria-hidden="true">${esc(initials(c))}</div>`;
function ringSvg(frac, color, size = 74, stroke = 7) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * f} ${c}"/></svg>`;
}

// ================= Speicher =================
const KEY = 'zaehlerbuch.daten.v3', OLD_KEY = 'zaehlerbuch.daten.v2', PREF = 'zaehlerbuch.prefs';
const store = {
  load() {
    try {
      const v = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
      return v ? sanitize(JSON.parse(v)) : null;
    } catch { return null; }
  },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); localStorage.removeItem(OLD_KEY); return true; } catch { return false; } },
  clear() { try { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); } catch {} },
  prefs() { try { return JSON.parse(localStorage.getItem(PREF)) || {}; } catch { return {}; } },
  setPref(k, v) { const p = this.prefs(); p[k] = v; try { localStorage.setItem(PREF, JSON.stringify(p)); } catch {} },
};

const app = { state: null, demo: false, tab: 'home', period: null, M: null, calcs: [], periods: [], pendingWarn: null, confirmDel: null, storageOk: true, lastTab: null, shown: {} };

function commit(s, msg) {
  app.state = s;
  if (!app.demo) {
    app.storageOk = store.save(s);
    if (!app.storageOk) toast('Speichern nicht möglich. Bitte eine Sicherung anlegen.');
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  render();
  if (msg) { toast(msg); if (navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(12); }
}

// ================= Rendern =================
function render() {
  const s = app.state;
  app.M = buildModel(s);
  const M = app.M;
  app.periods = listPeriods(M);
  const today = dn(todayStr());
  app.curIdx = app.periods.findIndex(p => dn(p.S) <= today && today < dn(p.E));
  if (app.curIdx < 0) app.curIdx = app.periods.length - 1;
  if (!app.period || !app.periods.some(p => p.S === app.period)) app.period = app.periods[app.curIdx].S;
  app.calcs = app.periods.map(p => calcPeriod(M, p));
  $('demoBar').hidden = !app.demo;
  renderHeader();
  const cur = currentContract(M), dl = kuendigenBis(cur), up = upcomingContract(M);
  const badge = (dl && !up && daysBetween(todayStr(), dl) <= 60 && daysBetween(todayStr(), dl) >= 0);
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === app.tab));
    const has = b.querySelector('.badge');
    if (b.dataset.tab === 'vertraege' && badge && !has) b.insertAdjacentHTML('beforeend', '<i class="badge" aria-label="Kündigungsfrist läuft"></i>');
    if ((!badge || b.dataset.tab !== 'vertraege') && has) has.remove();
  });
  const entering = app.lastTab !== app.tab;
  document.querySelectorAll('[data-panel]').forEach(p => {
    p.hidden = p.dataset.panel !== app.tab;
    if (p.hidden) p.innerHTML = '';
    p.classList.toggle('enter', !p.hidden && entering);
  });
  app.lastTab = app.tab;
  ({ home: renderHome, verlauf: renderVerlauf, vertraege: renderVertraege, statistik: renderStatistik, einstellungen: renderSettings })[app.tab]();
  countUp();
}
function renderHeader() {
  const s = app.state, h = new Date().getHours();
  const greet = h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend';
  $('hello').textContent = s.profil.name ? `${greet}, ${s.profil.name}` : greet;
  const t = new Date();
  $('helloSub').textContent = `${WTAG[t.getDay()]}, ${t.getDate()}. ${MONL[t.getMonth()]}`;
}
// Zahlen beim ersten Anzeigen hochzählen lassen
function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const target = +el.dataset.count, key = el.dataset.key || '';
    if (app.shown[key] === target) return;
    app.shown[key] = target;
    const prefix = el.dataset.prefix || '', suffix = el.dataset.suffix || '';
    const t0 = performance.now(), dur = 700;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), v = target * (1 - Math.pow(1 - p, 3));
      el.textContent = prefix + fmtN(Math.round(v)) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

// ---------- Übersicht ----------
function renderHome() {
  const s = app.state, M = app.M, c = app.calcs[app.curIdx], prev = app.calcs[app.curIdx - 1];
  const el = document.querySelector('[data-panel="home"]');
  const out = [];
  out.push(noticesHtml(M));
  const today = todayStr();
  const showBill = prev && prev.complete && daysBetween(ds(prev.e), today) <= 150 && c.knownDays < 90;
  if (showBill) {
    out.push(`<div class="cols wide"><div class="stack">${billHero(prev)}</div><div class="stack">${forecastCard(c, M, true)}</div></div>`);
  } else out.push(forecastCard(c, M, false));
  if (!c.noForecast) {
    const curAb = M.tarifAt(dn(today)).abschlag;
    out.push(`<div class="tiles">
      <div class="tile"><span class="ic">${icon('bolt', 16)}</span><span class="v">${fmtN(c.kwh / c.totalDays, 1)}<small>kWh</small></span><span class="k">pro Tag</span></div>
      <div class="tile"><span class="ic">${icon('receipt', 16)}</span><span class="v">${fmtN(c.cost / c.totalDays, 2)}<small>€</small></span><span class="k">Kosten pro Tag</span></div>
      <div class="tile"><span class="ic">${icon('chart', 16)}</span><span class="v">${fmtN(c.kwh)}<small>kWh</small></span><span class="k">${c.complete ? 'im Abrechnungsjahr' : 'erwartet im Jahr'}</span></div>
      <div class="tile"><span class="ic">${icon('target', 16)}</span><span class="v">${fmtN(c.fitAbschlag)}<small>€</small></span><span class="k">passender Abschlag · jetzt ${fmtEur(curAb)}</span></div>
    </div>`);
  }
  const left = [contractMini(M), recentCard(M)], right = [goalCard(c, prev), compareCardSmall(M, c)];
  if (!app.demo) {
    const ls = s.meta.letzteSicherung, age = ls ? daysBetween(ls, today) : null;
    if (age == null || age > 30) right.push(`<div class="notice warn"><div class="ico">${icon('save', 22)}</div><div class="txt"><b>${age == null ? 'Noch keine Sicherung' : `Letzte Sicherung vor ${age} Tagen`}</b><span>Deine Daten liegen nur auf diesem Gerät. Eine Sicherungsdatei schützt sie.</span></div><button class="btn sm" type="button" data-act="backup">Sichern</button></div>`);
  }
  out.push(`<div class="cols"><div class="stack">${left.join('')}</div><div class="stack">${right.join('')}</div></div>`);
  el.innerHTML = out.join('');
}

function noticesHtml(M) {
  const s = app.state, today = todayStr(), list = [];
  const cur = currentContract(M), up = upcomingContract(M), dl = kuendigenBis(cur);
  if (dl && !up) {
    const n = daysBetween(today, dl);
    if (n >= 0 && n <= 60) list.push(`<div class="notice ${n <= 14 ? 'bad' : 'warn'}"><div class="ico">${icon('clock', 22)}</div><div class="txt"><b>${n === 0 ? 'Heute letzter Tag zum Kündigen' : `Noch ${n} Tage zum Kündigen`}</b><span>${esc(contractName(cur))} läuft bis ${fmtD(cur.ende)}. Kündigung muss bis ${fmtD(dl)} ankommen.</span></div><button class="btn sm" type="button" data-goto="vertraege">Ansehen</button></div>`);
  }
  if (up) {
    const n = daysBetween(today, up.beginn), cl = checklistFor(M, up);
    list.push(`<div class="notice accent"><div class="ico">${icon('swap', 22)}</div><div class="txt"><b>Wechsel zu ${esc(contractName(up))} ${relDays(n)}</b><span>Lieferbeginn ${fmtD(up.beginn)} · Checkliste ${cl.done} von ${cl.total} erledigt</span></div><button class="btn primary sm" type="button" data-goto="vertraege">Checkliste</button></div>`);
  } else if (M.C.length > 1) {
    const cl = checklistFor(M, cur), since = daysBetween(cur.beginn, today);
    if (since >= 0 && since <= 150 && cl.done < cl.total) list.push(`<div class="notice accent"><div class="ico">${icon('swap', 22)}</div><div class="txt"><b>Wechsel zu ${esc(contractName(cur))}: ${cl.done} von ${cl.total} erledigt</b><span>Noch offen: ${esc(cl.items.find(i => !i.done).t)}</span></div><button class="btn sm" type="button" data-goto="vertraege">Checkliste</button></div>`);
  }
  const due = nextDue(s, M), dd = daysBetween(today, due);
  if (M.R.length && dd <= 3) list.push(`<div class="notice accent"><div class="ico">${icon('bell', 22)}</div><div class="txt"><b>${dd <= 0 ? 'Ablesung fällig' : 'Bald ablesen'}</b><span>${dd < 0 ? `Die nächste Ablesung war am ${fmtD(due)} dran.` : dd === 0 ? 'Heute ist Ablesetag.' : `Nächste Ablesung ${relDays(dd)}, am ${fmtD(due)}.`}</span></div><button class="btn primary sm" type="button" data-act="read">Jetzt ablesen</button></div>`);
  return list.join('');
}

function billHero(p) {
  const pos = p.diff >= 0, c = p.contract;
  return `<div class="card hero bill" style="--hero-tint:var(--${pos ? 'good' : 'bad'})">
    <div class="card-head"><span class="eyebrow">Abrechnung ${periodLabel(p)} · ${fmtDs(p.S)} – ${fmtDs(ds(p.e - 1))}</span><span class="pill ${pos ? 'good' : 'bad'}"><span class="dot"></span>${pos ? 'Guthaben' : 'Nachzahlung'}</span></div>
    <div style="display:flex;gap:14px;align-items:center">${avatar(c, 'sm')}<span class="muted small">Die Jahresrechnung von <b style="color:var(--fg)">${esc(contractName(c))}</b> sollte bald kommen. So sollte sie ungefähr aussehen:</span></div>
    <div class="hero-amount ${pos ? 'pos' : 'neg'}" data-count="${Math.round(Math.abs(p.diff))}" data-key="bill${p.S}" data-prefix="${pos ? '+' : '−'}" data-suffix=" €">${signEur(p.diff)}</div>
    <div class="breakdown">
      <div><span class="k">Verbrauch</span><span class="v">${fmtKwh(p.kwh)}</span></div>
      <div><span class="k">Kosten</span><span class="v">${fmtEur(p.cost, 0)}</span></div>
      <div><span class="k">Abschläge${p.bonusInBill ? ' + Bonus' : ''}</span><span class="v">${fmtEur(p.abschlaege + p.bonusInBill, 0)}</span></div>
    </div>
    <p class="small muted">Komplett gemessen, ${fmtN(p.cost / p.kwh * 100, 1)} ct pro kWh inklusive Grundpreis. Kommt die Rechnung mit einem anderen Betrag, lohnt ein genauer Blick.</p>
  </div>`;
}

function bandHtml(c) {
  const ext = Math.max(Math.abs(c.lo), Math.abs(c.hi), 20) * 1.25;
  const x = v => 50 + v / ext * 50;
  const lo = x(c.lo), hi = x(c.hi), mid = x(c.diff);
  return `<div class="band" role="img" aria-label="Erwartetes Ergebnis zwischen ${signEur(c.lo)} und ${signEur(c.hi)}">
    <div class="band-track"><div class="band-axis"></div><div class="band-zero" style="left:50%"></div>
      <div class="band-range" style="left:${lo}%;width:${Math.max(1, hi - lo)}%"></div>
      <div class="band-dot" style="left:${mid}%;background:var(--${c.diff >= 0 ? 'good' : 'bad'})"></div></div>
    <div class="band-labels"><span>◀ Nachzahlung</span><span>0 €</span><span>Guthaben ▶</span></div>
  </div>`;
}

function forecastCard(c, M, compact) {
  const range = `${fmtDs(c.S)} – ${fmtDs(ds(c.e - 1))}`;
  if (c.noForecast) {
    const lastR = M.R[M.R.length - 1];
    return `<div class="card hero"><span class="eyebrow">Abrechnungsjahr ${periodLabel(c)} · ${range}</span>
      <h2 style="font-size:1.5rem">Noch keine Prognose</h2>
      <p class="hero-text">Ab der zweiten Ablesung rechnet das Zählerbuch aus, ob du eine Nachzahlung oder ein Guthaben bekommst.${lastR ? ` Nächste Ablesung am besten um den ${fmtD(nextDue(app.state, M))}.` : ''}</p>
      ${lastR ? `<div class="meterline">Erster Zählerstand: <b class="num" style="color:var(--fg)">${standFmt(lastR.stand)} kWh</b> am ${fmtD(lastR.datum)}</div>` : ''}
      <button class="btn primary" type="button" data-act="read" style="justify-self:start">${icon('plus', 18)}Zähler ablesen</button></div>`;
  }
  const pos = c.diff >= 0, crosses = c.lo < 0 && c.hi > 0;
  const label = c.complete ? (pos ? 'Guthaben' : 'Nachzahlung') : c.sicherheit === 'niedrig' ? 'Erste Einschätzung' : c.sicherheit === 'mittel' ? 'Prognose' : 'Recht sichere Prognose';
  const pillCls = c.complete ? (pos ? 'good' : 'bad') : c.sicherheit === 'hoch' ? (pos ? 'good' : 'bad') : 'accent';
  const big = c.complete || c.sicherheit !== 'niedrig';
  const pct = c.knownDays / c.totalDays * 100;
  const basis = c.how === 'vorjahr' ? 'deinem Verbrauch im Vorjahr' : c.how === 'mix' ? 'Vorjahr und Durchschnitt' : `deinem Durchschnitt von ${fmtN(M.avgRate, 1)} kWh pro Tag`;
  let text;
  if (c.complete) text = pos ? `Deine Abschläge waren höher als die Kosten. Du bekommst etwa ${fmtEur(c.diff, 0)} zurück.` : `Deine Abschläge haben nicht gereicht. Rechne mit etwa ${fmtEur(-c.diff, 0)} Nachzahlung.`;
  else {
    text = crosses ? `Noch offen: irgendwo zwischen ${fmtEur(-c.lo, 0)} Nachzahlung und ${fmtEur(c.hi, 0)} Guthaben.` : `Wahrscheinlich zwischen ${signEur(c.lo)} und ${signEur(c.hi)}.`;
    text += c.knownDays === 0 ? ` Noch kein Tag gemessen, Grundlage ist ${basis}.` : ` ${c.knownDays} von ${c.totalDays} Tagen gemessen, der Rest geschätzt aus ${basis}.`;
    const curAb = M.tarifAt(dn(todayStr())).abschlag;
    if (c.fitAbschlag > curAb + 2 && !crosses) text += ` Mit etwa ${fmtN(c.fitAbschlag)} € Abschlag wärst du auf der sicheren Seite.`;
  }
  const max = Math.max(...c.months.map(m => m.known + m.est), 1);
  const spark = c.months.map(m => { const tot = m.known + m.est; return `<i class="${m.est > m.known ? 'est' : ''}" style="height:${Math.max(4, tot / max * 100)}%" title="${MONL[+m.key.slice(5, 7) - 1]}: ${fmtKwh(tot)}"></i>`; }).join('');
  const labels = c.months.map(m => `<span>${monLabel(m.key).slice(0, 1)}</span>`).join('');
  const amount = Math.round(Math.abs(c.diff));
  return `<div class="card hero">
    <div class="card-head"><span class="eyebrow">${compact ? 'Neues Jahr ' : 'Abrechnungsjahr '}${periodLabel(c)} · ${range}</span><span class="pill ${pillCls}"><span class="dot"></span>${label}</span></div>
    <div class="hero-amount ${big && !compact ? '' : 'mid'} ${pos ? 'pos' : 'neg'}">${c.complete ? '' : '<span class="approx">≈</span>'}<span data-count="${amount}" data-key="fc${c.S}" data-prefix="${pos ? '+' : '−'}" data-suffix=" €">${signEur(c.diff)}</span></div>
    ${c.complete ? '' : bandHtml(c)}
    <p class="hero-text${compact ? ' small' : ''}">${text}</p>
    ${compact ? '' : `<div class="spark" aria-hidden="true">${spark}</div><div class="spark-labels" aria-hidden="true">${labels}</div>`}
    ${c.complete ? '' : `<div style="display:grid;gap:6px"><div class="progress"><i style="width:${pct}%"></i></div><span class="meterline">Genauigkeit wächst mit jeder Ablesung · ${fmtN(pct)} % gemessen</span></div>`}
  </div>`;
}

function contractMini(M) {
  const c = currentContract(M), dl = kuendigenBis(c), t = M.tarifAt(dn(todayStr()));
  let line = c.ende ? `Läuft bis ${fmtD(c.ende)}` : 'Laufzeit nicht eingetragen';
  if (dl) { const n = daysBetween(todayStr(), dl); line += n >= 0 ? ` · Kündigen bis ${fmtD(dl)} (${relDays(n)})` : ' · Kündigungsfrist vorbei'; }
  return `<div class="card hov" style="cursor:pointer" data-goto="vertraege" role="button" tabindex="0" aria-label="Vertrag ansehen">
    <div class="card-head"><h2>Dein Vertrag</h2><span class="link-btn">Details ${icon('arrow', 16)}</span></div>
    <div class="contract-head">${avatar(c)}<div class="t"><b style="font-size:1.05rem">${esc(contractName(c))}</b><span class="sub">${esc(c.tarif ? c.tarif + ' · ' : '')}${fmtN(t.arbeitspreis, 2)} ct/kWh · ${fmtEur(t.abschlag)} Abschlag</span></div></div>
    <span class="meterline">${icon('clock', 16)}${line}</span>
    ${!c.anbieter ? `<span class="pill warn">Anbieter und Laufzeit noch nicht eingetragen</span>` : ''}
  </div>`;
}

function goalCard(c, prev) {
  const z = app.state.ziel.kwh;
  if (!z) {
    const sug = prev && prev.complete ? Math.round(prev.kwh * 0.9 / 10) * 10 : null;
    return `<div class="card"><div class="card-head"><h2>Sparziel</h2><span style="color:var(--accent)">${icon('target', 22)}</span></div>
      <p class="muted">Setz dir ein Ziel für dein Abrechnungsjahr. Das Zählerbuch zeigt dir, ob du auf Kurs bist.</p>
      <div class="btns">${sug ? `<button class="btn soft sm" type="button" data-act="goal-suggest" data-v="${sug}">${fmtN(sug)} kWh (−10 % zum Vorjahr)</button>` : ''}<button class="btn sm" type="button" data-act="goto-goal">Eigenes Ziel</button></div></div>`;
  }
  if (c.noForecast) return `<div class="card"><div class="card-head"><h2>Sparziel</h2><span class="pill accent">${fmtKwh(z)}</span></div><p class="muted">Ab der zweiten Ablesung siehst du hier, ob du auf Kurs bist.</p></div>`;
  const zz = z * c.totalDays / 365, over = c.kwh - zz, ok = over <= 0, remain = c.totalDays - c.knownDays;
  const pctUsed = Math.min(100, c.kwhKnown / zz * 100), pctFc = Math.min(100, c.kwh / zz * 100);
  let text;
  if (c.complete) text = ok ? `Geschafft: ${fmtKwh(-over)} unter deinem Ziel.` : `Ziel um ${fmtKwh(over)} verfehlt.`;
  else if (ok) text = `Du liegst auf Kurs, voraussichtlich ${fmtKwh(-over)} unter dem Ziel.`;
  else text = `Voraussichtlich ${fmtKwh(over)} drüber. Dafür müsstest du ab jetzt ${fmtN(over / remain, 1)} kWh pro Tag weniger verbrauchen.`;
  const col = ok ? 'var(--accent)' : 'var(--series-2)';
  return `<div class="card"><div class="card-head"><h2>Sparziel</h2><span class="pill ${ok ? 'good' : 'warn'}"><span class="dot"></span>${ok ? 'auf Kurs' : 'drüber'}</span></div>
    <div class="big-stat">${fmtN(c.kwh)} <small>von ${fmtN(zz)} kWh</small></div>
    <div class="progress" style="height:10px;border-radius:5px" role="img" aria-label="${fmtN(pctFc)} Prozent des Ziels erwartet">
      <i style="width:${pctFc}%;background:color-mix(in srgb, ${col} 30%, transparent);position:absolute;left:0;top:0"></i>
      <i style="width:${pctUsed}%;background:${col};position:absolute;left:0;top:0"></i></div>
    <p class="small muted">${text}</p></div>`;
}
function compareCardSmall(M, c) {
  const b = yearBasis(M, c), p = app.state.profil;
  if (!b) return `<div class="card"><div class="card-head"><h2>Einordnung</h2></div><p class="muted">Sobald genug Daten da sind, vergleicht das Zählerbuch deinen Verbrauch mit ähnlichen Haushalten.</p></div>`;
  const rw = richtwert(p), r = b.kwh / rw;
  const word = r < 0.8 ? 'sparsam' : r <= 1.15 ? 'im üblichen Bereich' : 'eher hoch';
  return `<div class="card"><div class="card-head"><h2>Einordnung</h2><button class="link-btn" type="button" data-goto="statistik">Mehr ${icon('arrow', 16)}</button></div>
    ${scaleHtml(b.kwh, rw)}
    <p class="small muted">Mit ${fmtKwh(b.kwh)} pro Jahr bist du für ${p.personen === 5 ? '5 und mehr Personen' : p.personen === 1 ? '1 Person' : p.personen + ' Personen'} in ${p.wohnform === 'haus' ? 'einem Haus' : 'einer Wohnung'} <b style="color:var(--fg)">${word}</b>.</p></div>`;
}
function scaleHtml(kwh, rw) {
  const max = Math.max(rw * 1.8, kwh * 1.12);

  const you = Math.min(96, Math.max(4, kwh / max * 100)), ref = rw / max * 100;
  return `<div class="scale-wrap">
    <div class="scale-mark" style="left:${you}%"><span class="num">Du · ${fmtN(kwh)}</span><span class="dot"></span></div>
    <div class="scale" aria-hidden="true"><i style="width:${z1}%;background:var(--good-soft)"></i><i style="width:${z2}%;background:var(--surface-3)"></i><i style="flex:1;background:var(--bad-soft)"></i></div>
    <div class="scale-ref" style="left:${ref}%">typisch ${fmtN(rw)}</div>
  </div><div class="scale-labels"><span>sparsam</span><span>üblich</span><span>hoch</span></div>`;
}
function recentCard(M) {

// ---------- Verlauf ----------

// ---------- Verträge ----------
function renderVertraege() {
  const M = app.M, today = todayStr();
  const cur = currentContract(M), up = upcomingContract(M);
  // Checkliste gehört zum kommenden Vertrag oder, im ersten Jahr nach einem Wechsel, zum aktuellen.
  const clc = up || (M.C.length > 1 && daysBetween(cur.beginn, today) <= 365 ? cur : null);
  const side = [countdownCard(cur, up)];
  if (clc) side.push(checklistCard(clc, M));
  if (up) side.push(`<div class="card"><div class="switch-row"><div class="contract-head">${avatar(up, 'sm')}<div class="t"><b>${esc(contractName(up))}</b><span class="sub">kommt ab ${fmtD(up.beginn)}</span></div></div><button class="btn soft sm" type="button" data-act="edit-contract" data-id="${up.id}">Vertragsakte</button></div></div>`);
  else side.push(`<div class="card"><div class="switch-row"><div style="display:grid;gap:2px;min-width:0;flex:1"><h2>Anbieter wechseln</h2><span class="small muted">Neuen Vertrag hier anlegen, ab Lieferbeginn gelten die neuen Preise.</span></div><button class="btn primary sm" type="button" data-act="new-contract">${icon('plus', 16)}Neuer Vertrag</button></div></div>`);
  document.querySelector('[data-panel="vertraege"]').innerHTML =
    `<div class="cols"><div class="stack">${contractCard(cur, M, 'current')}</div><div class="stack">${side.join('')}</div></div>` + historyHtml(M);
}
function contractCard(c, M, kind) {
  const today = todayStr(), lastP = c.preise[c.preise.length - 1];
  const t = kind === 'upcoming' ? c.preise[0] : M.tarifAt(dn(today));
  let term = '';
  if (c.ende) {
    const total = daysBetween(c.beginn, c.ende) + 1, gone = Math.max(0, Math.min(total, daysBetween(c.beginn, today)));
    const dl = kuendigenBis(c);
    term = `<div class="term"><div class="term-bar" role="img" aria-label="Laufzeit zu ${fmtN(gone / total * 100)} Prozent vorbei"><i style="width:${gone / total * 100}%"></i>${dl ? `<span class="dl" style="left:${Math.max(0, Math.min(100, (daysBetween(c.beginn, dl) + 1) / total * 100))}%" title="Kündigen bis ${fmtD(dl)}"></span>` : ''}</div>
      <div class="term-labels"><span>${fmtD(c.beginn)}</span>${dl ? `<span style="color:var(--series-2);font-weight:650">Kündigen bis ${fmtDs(dl)}</span>` : ''}<span>${fmtD(c.ende)}</span></div></div>`;
  }
  const facts = [
    ['Arbeitspreis', fmtN(t.arbeitspreis, 2) + ' ct/kWh'], ['Grundpreis', fmtEur(t.grundpreis) + '/Monat'],
    ['Abschlag', fmtEur(t.abschlag) + '/Monat'], ['Preisgarantie', c.preisgarantie ? 'bis ' + fmtD(c.preisgarantie) : '–'],
  ];
  for (const [k, l] of [['sofort', 'Sofortbonus'], ['neukunde', 'Neukundenbonus']]) { const b = c.bonus[k]; if (b.betrag) facts.push([l, fmtEur(b.betrag, 0) + (b.erhalten ? ' · erhalten' : ' · offen')]); }
  facts.push(['Kündigungsfrist', c.frist.wert != null ? `${c.frist.wert} ${c.frist.einheit === 'monate' ? (c.frist.wert === 1 ? 'Monat' : 'Monate') : c.frist.einheit === 'tage' ? 'Tage' : (c.frist.wert === 1 ? 'Woche' : 'Wochen')}` : '–']);
  const nums = [['Kundennummer', c.kundennr], ['Vertragsnummer', c.vertragsnr], ['Zählernummer', c.zaehlernr], ['Telefon', c.kontakt.tel], ['E-Mail', c.kontakt.mail]].filter(x => x[1]);
  const web = c.kontakt.web && /^https?:\/\//i.test(c.kontakt.web) ? c.kontakt.web : c.kontakt.web ? 'https://' + c.kontakt.web : '';

    <div class="card-head"><span class="pill ${kind === 'upcoming' ? 'accent' : 'good'}"><span class="dot"></span>${kind === 'upcoming' ? 'Kommt ab ' + fmtD(c.beginn) : 'Aktueller Vertrag'}</span><button class="icon-btn" type="button" data-act="edit-contract" data-id="${c.id}" aria-label="Vertrag bearbeiten">${icon('edit', 18)}</button></div>
    <div class="contract-head">${avatar(c, 'lg')}<div class="t"><h2>${esc(contractName(c))}</h2><span class="sub">${esc(c.tarif || 'Tarif nicht eingetragen')} · seit ${fmtD(c.beginn)}</span></div></div>
    ${!c.anbieter || !c.ende ? `<button class="notice warn" type="button" data-act="edit-contract" data-id="${c.id}" style="border:0;text-align:left;cursor:pointer"><div class="ico">${icon('edit', 20)}</div><div class="txt"><b>Vertragsakte vervollständigen</b><span>Anbieter, Laufzeit und Kündigungsfrist eintragen, dann erinnert dich das Zählerbuch rechtzeitig.</span></div></button>` : ''}
    ${term}
    <div class="facts">${facts.map(f => `<div><span class="k">${f[0]}</span><span class="v">${esc(f[1])}</span></div>`).join('')}</div>
    ${c.preise.length > 1 ? `<p class="small muted">${c.preise.length - 1} Preisänderung${c.preise.length > 2 ? 'en' : ''} im Vertrag, zuletzt ab ${fmtD(lastP.ab)}.</p>` : ''}
    ${nums.length ? `<div>${nums.map(n => `<div class="copyrow"><span class="k">${n[0]}</span><span class="v">${esc(n[1])}</span><button class="icon-btn" type="button" data-act="copy" data-v="${esc(n[1])}" aria-label="${n[0]} kopieren">${icon('copy', 17)}</button></div>`).join('')}</div>` : ''}

  </div>`;
}
function countdownCard(c, up) {

  if (up) return `<div class="card"><div class="card-head"><h2>Kündigung</h2><span class="pill good"><span class="dot"></span>Wechsel geplant</span></div><p class="small muted">Dein neuer Vertrag bei ${esc(contractName(up))} beginnt am ${fmtD(up.beginn)}.</p></div>`;

    return `<div class="card"><div class="card-head"><h2>Kündigung</h2><span class="pill warn"><span class="dot"></span>Frist vorbei</span></div>
      <p class="small" style="color:var(--fg-2)">${ended ? `Die Erstlaufzeit ist am ${fmtD(c.ende)} ausgelaufen.` : `Die Frist war am ${fmtD(dl)}.`} Ohne Kündigung verlängert sich der Vertrag. Seit 2022 sind solche Verträge in der Regel <b>mit einem Monat Frist</b> kündbar. Prüf das in deinen Vertragsunterlagen.</p>

  }

    <div class="countdown ${cls}"><div class="ring">${ringSvg(n / window, col)}<span>${n}<small>${n === 1 ? 'Tag' : 'Tage'}</small></span></div>

}
function checklistCard(c, M) {

  const ring = `<div class="ring-sm">${ringSvg(cl.done / cl.total, 'var(--accent)', 46, 5).replace('stroke="var(--surface)"', 'stroke="var(--surface-2)"')}<span>${cl.done}/${cl.total}</span></div>`;
  return `<div class="card"><div class="ck-head"><div class="who">${ring}<div><h2>Wechsel-Checkliste</h2><span class="small muted">${next ? 'Offen: ' + esc(next.t) : 'Alles erledigt'}</span></div></div>
      <button class="btn sm" type="button" data-act="ck-toggle" data-id="${c.id}" aria-expanded="${open}">${open ? 'Einklappen' : 'Anzeigen'}</button></div>
    ${open ? `<div class="checklist">${cl.items.map(i => `<button type="button" class="ck" role="checkbox" aria-checked="${i.done}" data-act="check" data-id="${c.id}" data-k="${i.k}" ${i.auto ? 'disabled style="cursor:default"' : ''}>
      <span class="box">${icon('check', 16)}</span><span class="t"><b>${esc(i.t)}</b><span>${i.auto ? 'Automatisch erkannt' : c.checks[i.k] ? 'Erledigt am ' + fmtD(c.checks[i.k]) : i.bonus && c.bonus[i.bonus].erhalten ? 'Erhalten am ' + fmtD(c.bonus[i.bonus].erhalten) : esc(i.h)}</span></span></button>`).join('')}</div>` : ''}</div>`;
