function historyHtml(M) {
  const rows = M.C.slice().reverse().map(c => {
    const pers = app.calcs.filter(p => p.cid === c.id && !p.noForecast);
    const kwh = pers.reduce((a, p) => a + p.kwh, 0), net = pers.reduce((a, p) => a + p.netCost, 0), diff = pers.reduce((a, p) => a + p.diff, 0);
    const allDone = pers.length && pers.every(p => p.complete);
    return { c, pers, kwh, net, diff, eff: kwh ? net / kwh * 100 : null, allDone };
  });
  const effs = rows.filter(r => r.eff != null);
  const maxEff = Math.max(...effs.map(r => r.eff), 1);
  const today = dn(todayStr());
  return `<h2 class="section-title">Anbieter-Historie</h2><p class="section-sub">Alle deine Stromverträge und was sie dich wirklich gekostet haben.</p>
  <div class="cols wide">
    <div class="card"><div class="timeline">${rows.map(r => {
      const c = r.c, endTxt = c.ende ? fmtDs(c.ende) : 'offen', future = c.d > today;
      return `<div class="tl">${avatar(c)}<div class="body">
        <div class="row1"><b>${esc(contractName(c))}</b>${future ? '<span class="pill accent">kommt</span>' : r.pers.length ? `<span class="pill ${r.diff >= 0 ? 'good' : 'bad'}">${r.allDone ? '' : '≈ '}${signEur(r.diff)}</span>` : ''}</div>
        <span class="meta">${esc(c.tarif ? c.tarif + ' · ' : '')}${fmtDs(c.beginn)} – ${endTxt}</span>
        <div class="stats">${r.eff != null ? `<span>${fmtN(r.eff, 1)} ct/kWh effektiv</span><span>${fmtKwh(r.kwh)}</span><span>${fmtEur(r.net, 0)}${bonusTotal(c) ? ' nach Bonus' : ''}</span>` : `<span>${fmtN(c.preise[0].arbeitspreis, 2)} ct/kWh</span>`}${bonusTotal(c) ? `<span>${icon('gift', 12)} ${fmtEur(bonusTotal(c), 0)} Bonus</span>` : ''}</div>
        <button class="link-btn" type="button" data-act="edit-contract" data-id="${c.id}" style="justify-self:start">Vertragsakte ${icon('arrow', 14)}</button>
      </div></div>`;
    }).join('')}</div></div>
    <div class="card"><div class="card-head"><h2>Echter Preis pro kWh</h2></div>
      <p class="small muted">Alles eingerechnet: Arbeitspreis, Grundpreis und Bonus, geteilt durch deinen Verbrauch.</p>
      ${effs.length ? `<div style="display:grid;gap:10px">${effs.slice().reverse().map(r => `<div class="pricebar"><span class="lab">${esc(initials(r.c))} ${r.c.beginn.slice(2, 4)}</span><i style="width:${r.eff / maxEff * 100}%;background:var(--p${hue(r.c)})"></i><span class="val">${fmtN(r.eff, 1)} ct</span></div>`).join('')}</div>` : '<div class="empty">Braucht mindestens zwei Ablesungen.</div>'}
      ${effs.length >= 2 ? (() => { const a = effs[effs.length - 1], b = effs[0]; const d = b.eff - a.eff; return `<p class="small" style="color:var(--fg-2)">${d < 0 ? `Dein aktueller Vertrag ist <b>${fmtN(-d, 1)} ct pro kWh günstiger</b> als dein erster im Zählerbuch.` : `Dein aktueller Vertrag ist ${fmtN(d, 1)} ct pro kWh teurer als dein erster im Zählerbuch.`}</p>`; })() : ''}
    </div>
  </div>`;
}

// ---------- Statistik ----------
function renderStatistik() {
  const M = app.M, s = app.state, c = app.calcs[app.curIdx];
  const months = calendarMonths(M), html = [];
  const b = yearBasis(M, c), rw = richtwert(s.profil), cards = [], einordnung = [];
  if (b) {
    const diffPct = Math.round((b.kwh / rw - 1) * 100);
    einordnung.push(`<div class="card"><div class="card-head"><h2>Ähnliche Haushalte</h2><button class="link-btn" type="button" data-goto="einstellungen">Haushalt ändern</button></div>${scaleHtml(b.kwh, rw)}
      <p class="small muted">Du verbrauchst ${diffPct === 0 ? 'genau so viel wie' : `${Math.abs(diffPct)} % ${diffPct < 0 ? 'weniger' : 'mehr'} als`} ein typischer Haushalt mit ${s.profil.personen === 5 ? '5+' : s.profil.personen} ${s.profil.personen === 1 ? 'Person' : 'Personen'} in ${s.profil.wohnform === 'haus' ? 'einem Haus' : 'einer Wohnung'} (${fmtKwh(rw)}). Grobe Richtwerte für Deutschland, ohne Warmwasser über Strom.</p></div>`);
    const co2 = b.kwh * s.profil.co2 / 1000;
    einordnung.push(`<div class="card"><div class="card-head"><h2>CO₂-Fußabdruck</h2><span style="color:var(--accent)">${icon('leaf', 22)}</span></div>
      <div class="big-stat">${fmtN(co2)} <small>kg CO₂ im Jahr</small></div>
      <div class="duo"><div><span class="v">${fmtN(co2 / 12)}</span><span class="k">kg pro Monat</span></div><div><span class="v">${fmtN(co2 / 365, 1)}</span><span class="k">kg pro Tag</span></div></div>
      <p class="small muted">Gerechnet mit ${fmtN(s.profil.co2)} g CO₂ pro kWh (deutscher Strommix, ca.). Bei Ökostrom steht der Wert auf deiner Rechnung, du kannst ihn unter „Mehr“ ändern.</p></div>`);
  } else einordnung.push(`<div class="card span"><div class="empty">Ab der zweiten Ablesung siehst du hier, wie dein Verbrauch dasteht.</div></div>`);
  const byKey = new Map(months.map(m => [m.key, m]));
  const yoy = months.filter(m => m.complete).map(m => { const p = byKey.get(String(+m.key.slice(0, 4) - 1) + m.key.slice(4)); return p && p.complete ? { key: m.key, now: m.kwh, prev: p.kwh, pct: (m.kwh - p.kwh) / p.kwh * 100 } : null; }).filter(Boolean).slice(-12);
  cards.push(`<div class="card"><div class="card-head"><h2>Gegenüber dem Vorjahr</h2></div>${yoy.length ? `<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>weniger als im Vorjahr</span><span><i class="sw" style="background:var(--series-2)"></i>mehr</span></div><div class="chart" id="yoyChart"></div>` : '<div class="empty">Sobald ein Monat zwei Jahre hintereinander komplett gemessen ist, siehst du hier, ob du mehr oder weniger verbrauchst.</div>'}</div>`);
  const roll = rollingYear(M);
  cards.push(`<div class="card"><div class="card-head"><h2>Trend: Jahresverbrauch</h2></div>${roll.length >= 2 ? `<p class="small muted">Verbrauch der jeweils letzten 12 Monate. Fällt die Linie, sparst du dauerhaft.</p><div class="chart" id="trendChart"></div>` : `<div class="empty">Der Trend braucht etwas mehr als ein Jahr Daten.${roll.length === 1 ? ` Bisher: ${fmtKwh(roll[0].kwh)} in den letzten 12 Monaten.` : ''}</div>`}</div>`);
  html.push(`<h2 class="section-title">Entwicklung</h2><p class="section-sub">Verbrauchst du mehr oder weniger als früher?</p><div class="cols">${cards.join('')}</div>`);
  html.push(`<h2 class="section-title">Verbrauchsmuster</h2><p class="section-sub">Wann verbrauchst du wie viel?</p>`);
  const pc = [], se = seasons(M);
  if (se && se.summer != null && se.winter != null) {
    const pct = Math.round((se.winter / se.summer - 1) * 100);
    pc.push(`<div class="card"><div class="card-head"><h2>Sommer und Winter</h2></div>
      <div class="duo"><div><span class="k">Sommer (Apr–Sep)</span><span class="v">${fmtN(se.summer, 1)}</span><span class="k">kWh pro Tag</span></div><div><span class="k">Winter (Okt–Mär)</span><span class="v">${fmtN(se.winter, 1)}</span><span class="k">kWh pro Tag</span></div></div>
      <p class="small muted">Im Winter verbrauchst du ${pct >= 0 ? pct + ' % mehr' : -pct + ' % weniger'} als im Sommer.${se.sn < 120 || se.wn < 120 ? ' Noch nicht ein ganzes Jahr gemessen, der Wert wird genauer.' : ''}</p></div>`);
  } else pc.push(`<div class="card"><div class="card-head"><h2>Sommer und Winter</h2></div><div class="empty">Braucht Ablesungen aus Sommer- und Wintermonaten.</div></div>`);
  const full = months.filter(m => m.complete);
  if (full.length >= 2) {
    const hi = full.reduce((a, b) => b.perDay > a.perDay ? b : a), lo = full.reduce((a, b) => b.perDay < a.perDay ? b : a);
    const nm = k => MONL[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
    pc.push(`<div class="card"><div class="card-head"><h2>Rekordmonate</h2></div><div class="list">
      <div class="li"><div class="daydot" style="background:var(--bad-soft);color:var(--bad)">▲</div><div class="main"><b>${nm(hi.key)}</b><span>höchster Verbrauch</span></div><div class="end"><b>${fmtKwh(hi.kwh)}</b><span>${fmtN(hi.perDay, 1)} kWh/Tag</span></div></div>
      <div class="li"><div class="daydot" style="background:var(--good-soft);color:var(--good)">▼</div><div class="main"><b>${nm(lo.key)}</b><span>niedrigster Verbrauch</span></div><div class="end"><b>${fmtKwh(lo.kwh)}</b><span>${fmtN(lo.perDay, 1)} kWh/Tag</span></div></div>
      </div><p class="small muted">Pro Tag verglichen, damit kurze und lange Monate fair sind.</p></div>`);
  } else pc.push(`<div class="card"><div class="card-head"><h2>Rekordmonate</h2></div><div class="empty">Sobald zwei Monate komplett gemessen sind, siehst du hier deine Spitzen.</div></div>`);
  const yrs = app.calcs.filter(x => !x.noForecast);
  pc.push(`<div class="card"><div class="card-head"><h2>Jahre im Vergleich</h2></div>${yrs.length ? `<div class="chart" id="yearsChart"></div><p class="small muted">Abrechnungsjahre. Schraffiert ist der geschätzte Teil.</p>` : '<div class="empty">Noch keine Daten.</div>'}</div>`);
  pc.push(`<div class="card"><div class="card-head"><h2>Kalender</h2></div>${M.iv.length ? `<p class="small muted">Verbrauch pro Tag im letzten Jahr, zwischen zwei Ablesungen gemittelt. Je öfter du abliest, desto genauer das Bild.</p><div class="scroll-x" id="heatWrap"></div><div class="heat-legend">weniger <i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><i style="background:var(--heat-4)"></i><i style="background:var(--heat-5)"></i> mehr</div>` : '<div class="empty">Noch keine Daten.</div>'}</div>`);
  html.push(`<div class="cols">${pc.join('')}</div>`);
  html.push(`<h2 class="section-title">Einordnung</h2><p class="section-sub">Wie steht dein Verbrauch im Vergleich da?</p><div class="cols">${einordnung.join('')}</div>`);
  document.querySelector('[data-panel="statistik"]').innerHTML = html.join('');
  if (yoy.length) yoyChart($('yoyChart'), yoy);
  if (roll.length >= 2) trendChart($('trendChart'), roll);
  if (yrs.length) yearsChart($('yearsChart'), yrs);
  if (M.iv.length) heatmap($('heatWrap'), M);
}

const ed = { draft: null, isNew: false };
function openContract(id) {
  if (app.demo && id === undefined) { toast('Leg zuerst dein eigenes Zählerbuch an.'); openGuide('setup', 1); return; }
  const s = app.state;
  if (id) { ed.draft = JSON.parse(JSON.stringify(s.vertraege.find(c => c.id === id))); ed.isNew = false; }
  else {
    const last = s.vertraege[s.vertraege.length - 1];
    const beginn = last.ende ? ds(dn(last.ende) + 1) : addMonths(last.beginn, 12) > todayStr() ? addMonths(last.beginn, 12) : todayStr();
    ed.draft = cleanContract({ beginn, zaehlernr: last.zaehlernr, frist: { wert: null, einheit: 'wochen' }, preise: [{ ...last.preise[last.preise.length - 1], ab: beginn }] });

  ed.confirmDel = false;

function readContractEditor() {
  const c = ed.draft, v = id => ($(id) ? $(id).value : '');
  c.anbieter = v('ce-anbieter').trim(); c.tarif = v('ce-tarif').trim();
  c.beginn = v('ce-beginn'); c.ende = v('ce-ende') || null; c.preisgarantie = v('ce-garantie') || null;
  const fw = v('ce-fwert').trim(); c.frist = { wert: fw === '' ? null : parseInt(fw, 10), einheit: v('ce-feinheit') };
  const bn = id => v(id).trim() ? parseNum(v(id)) : 0;
  c.bonus = { sofort: { betrag: bn('ce-bsofort'), erhalten: v('ce-bsofortd') || null }, neukunde: { betrag: bn('ce-bneu'), erhalten: v('ce-bneud') || null } };
  c.kundennr = v('ce-kundennr').trim(); c.vertragsnr = v('ce-vertragsnr').trim(); c.zaehlernr = v('ce-zaehlernr').trim();
  c.kontakt = { web: v('ce-web').trim(), tel: v('ce-tel').trim(), mail: v('ce-mail').trim() };
  c.notiz = v('ce-notiz');
  c.preise = c.preise.map((p, i) => ({ ab: i === 0 ? c.beginn : v('ce-ab-' + i), arbeitspreis: parseNum(v('ce-ap-' + i)), grundpreis: parseNum(v('ce-gp-' + i)), abschlag: parseNum(v('ce-as-' + i)) }));
}
function validateContract() {
  const c = ed.draft, others = app.state.vertraege.filter(x => x.id !== c.id);
  if (!isDate(c.beginn)) return 'Bitte den Lieferbeginn eintragen.';
  if (others.some(x => x.beginn === c.beginn)) return 'An diesem Tag beginnt schon ein anderer Vertrag.';
  if (c.ende && c.ende <= c.beginn) return 'Das Laufzeitende muss nach dem Lieferbeginn liegen.';
  if (c.frist.wert != null && (!Number.isInteger(c.frist.wert) || c.frist.wert < 0 || c.frist.wert > 52)) return 'Bitte die Kündigungsfrist als ganze Zahl eintragen, z. B. 6.';
  if (!(c.bonus.sofort.betrag >= 0) || !(c.bonus.neukunde.betrag >= 0)) return 'Bitte den Bonus als Zahl eintragen, z. B. 100.';
  for (const [i, p] of c.preise.entries()) {

  for (const r of M.R) { if (r.datum === skip) continue; if (r.d < d) before = r; else if (r.d > d && !after) after = r; }
  if (before && stand < before.stand) return { err: `Der Stand ist kleiner als am ${fmtD(before.datum)} (${standFmt(before.stand)}). Bitte noch einmal ablesen.`, field: 'enStand' };
  if (after && stand > after.stand) return { err: `Der Stand ist größer als die spätere Ablesung am ${fmtD(after.datum)} (${standFmt(after.stand)}).`, field: 'enStand' };
  let info = '', warn = '';
  if (before) {
    const days = d - before.d, kwh = stand - before.stand, rate = kwh / days;
    info = `+${fmtN(kwh, kwh % 1 ? 1 : 0)} kWh in ${days} ${days === 1 ? 'Tag' : 'Tagen'} · ${fmtN(rate, 1)} kWh pro Tag`;
    if (M.avgRate && days >= 3 && (rate > M.avgRate * 2.5 || rate < M.avgRate * 0.3)) warn = `Das ist ${rate > M.avgRate ? 'viel mehr' : 'viel weniger'} als sonst (${fmtN(M.avgRate, 1)} kWh pro Tag). Stimmt die Zahl?`;
  }
  return { datum, stand, info, warn };
}

// ================= Sicherung & Dateien =================
function backupJson() { return JSON.stringify({ ...app.state, meta: { ...app.state.meta, letzteSicherung: todayStr() }, app: 'Zählerbuch Strom' }, null, 2); }
function downloadFile(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function markBackup() { commit({ ...app.state, meta: { ...app.state.meta, letzteSicherung: todayStr() } }); }
function doBackup() { if (app.demo) { toast('Beispieldaten werden nicht gesichert.'); return; } downloadFile(`zaehlerbuch-sicherung-${todayStr()}.json`, backupJson(), 'application/json'); markBackup(); toast('Sicherung gespeichert'); }
async function doShare() {
  const file = new File([backupJson()], `zaehlerbuch-sicherung-${todayStr()}.json`, { type: 'application/json' });
  try { await navigator.share({ files: [file], title: 'Zählerbuch-Sicherung' }); markBackup(); toast('Sicherung geteilt'); }
  catch (e) { if (e && e.name !== 'AbortError') doBackup(); }
}
function parseCsv(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    const parts = line.split(/[;\t,](?=\s*[\d"])/).map(p => p.trim().replace(/^"|"$/g, ''));
    if (parts.length < 2) continue;
    let d = parts[0], mm;
    if ((mm = d.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/))) d = `${mm[3].length === 2 ? '20' + mm[3] : mm[3]}-${mm[2].padStart(2, '0')}-${mm[1].padStart(2, '0')}`;
    const v = parseNum(parts[1]);
    if (isDate(d) && isFinite(v) && v >= 0) out.push({ datum: d, stand: v });
  }
  return out;
}
async function importFile(file) {
  const text = await file.text();
  try {
    if (/^\s*\{/.test(text)) {
      const s = sanitize(JSON.parse(text));
      app.demo = false; app.period = null;
      if ($('guide').open) $('guide').close();
      commit(s, `Sicherung geladen: ${s.readings.length} Ablesungen`);
      store.setPref('onboarded', true);
    } else {
      const rows = parseCsv(text);
      if (!rows.length) throw new Error('In der Datei wurden keine Zeilen mit Datum und Zählerstand gefunden.');
      if (app.demo) { toast('Leg zuerst dein Zählerbuch an, dann kannst du die Tabelle laden.'); return; }
      const map = new Map(app.state.readings.map(r => [r.datum, r]));
      rows.forEach(r => map.set(r.datum, r));
      commit(sanitize({ ...app.state, readings: [...map.values()] }), `${rows.length} Ablesungen übernommen`);
    }
  } catch (e) { toast(e instanceof SyntaxError ? 'Die Datei ist keine Zählerbuch-Sicherung.' : e.message); }
}

}
function guideValidate(id) {
  const g = guide.draft, msg = $('gMsg'), bad = t => (showMsg(msg, t, 'err'), false);
  if (id === 'contract') {
    const ap = parseNum(g.ap), gp = parseNum(g.gp), ab = parseNum(g.ab);
    if (!isDate(g.beginn)) return bad('Bitte den Lieferbeginn wählen.');
    if (!isFinite(ap) || ap <= 0) return bad('Bitte den Arbeitspreis in Cent eintragen, z. B. 33,13.');
    if (ap < 1) return bad(`Der Arbeitspreis wird in Cent angegeben: ${fmtN(ap * 100, 2)} statt ${String(g.ap)}.`);
    if (ap > 200) return bad('Der Arbeitspreis scheint zu hoch. Bitte in Cent pro kWh, z. B. 33,13.');
    if (!isFinite(gp) || gp < 0) return bad('Bitte den Grundpreis pro Monat eintragen, z. B. 13,76.');
    if (!isFinite(ab) || ab < 0) return bad('Bitte deinen monatlichen Abschlag eintragen, z. B. 82.');
  }
  if (id === 'term') {
    if (g.ende && (!isDate(g.ende) || g.ende <= g.beginn)) return bad('Das Laufzeitende muss nach dem Lieferbeginn liegen.');
    if (g.fwert.trim() && !/^\d{1,2}$/.test(g.fwert.trim())) return bad('Bitte die Frist als ganze Zahl eintragen, z. B. 6.');
    if ([g.bsofort, g.bneu].some(x => x.trim() && !(parseNum(x) >= 0))) return bad('Bitte den Bonus als Zahl eintragen, z. B. 100.');
  }
  if (id === 'meter') {
    const st = parseNum(g.stand);
    if (!String(g.stand).trim() || !isFinite(st) || st < 0) return bad('Bitte den Zählerstand als Zahl eintragen, z. B. 22812.');
    if (!isDate(g.datum) || g.datum > todayStr()) return bad('Bitte ein Datum wählen, nicht in der Zukunft.');
  }
  return true;
}
$('guide').addEventListener('click', ev => {
  const b = ev.target.closest('[data-g], [data-gpers], [data-gwohn]');
  if (!b) return;
  readGuideInputs();
  const id = guideSteps()[guide.step];
  if (b.dataset.gpers) { guide.draft.personen = +b.dataset.gpers; renderGuide(); return; }
  if (b.dataset.gwohn) { guide.draft.wohnform = b.dataset.gwohn; renderGuide(); return; }
  const act = b.dataset.g;
  if (act === 'back') { guide.step--; renderGuide(); }
  else if (act === 'next') { if (!guideValidate(id)) return; guide.step++; renderGuide(); }
  else if (act === 'demo') { app.demo = true; app.state = sampleState(); app.period = null; $('guide').close(); render(); toast('Beispieldaten. Nichts wird gespeichert.'); }
  else if (act === 'create') {
    if (!guideValidate(id)) return;
    const g = guide.draft, beginn = g.beginn < g.datum ? g.beginn : g.datum;
    const s = sanitize({ profil: { name: g.name, personen: g.personen, wohnform: g.wohnform },
      vertraege: [{ anbieter: g.anbieter, beginn, ende: g.ende || null, frist: { wert: g.fwert.trim() ? parseInt(g.fwert, 10) : null, einheit: g.feinheit },
        bonus: { sofort: { betrag: g.bsofort.trim() ? parseNum(g.bsofort) : 0 }, neukunde: { betrag: g.bneu.trim() ? parseNum(g.bneu) : 0 } }, preise: [{ ab: beginn, arbeitspreis: parseNum(g.ap), grundpreis: parseNum(g.gp), abschlag: parseNum(g.ab) }] }],
      readings: [{ datum: g.datum, stand: parseNum(g.stand) }] });
    app.demo = false; app.period = null; app.tab = 'home';
    commit(s); store.setPref('onboarded', true);
    guide.step++; renderGuide();
  }
  else if (act === 'finish') { $('guide').close(); store.setPref('onboarded', true); }
});
$('guide').addEventListener('cancel', ev => { if (guide.mode === 'setup' && !app.demo && !store.load()) ev.preventDefault(); });

// ================= Ereignisse =================
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab], [data-goto], [data-period], [data-act], [data-pers], [data-wohn], [data-int], [data-theme-set]');
  if (!t || (t.closest('#guide') && !t.dataset.act) || t.closest('#contractDlg') && !t.dataset.act) return;
  if (t.dataset.tab || t.dataset.goto) { app.tab = t.dataset.tab || t.dataset.goto; app.confirmDel = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.dataset.period) { app.period = t.dataset.period; render(); return; }
  const s = app.state;
  if (t.dataset.pers || t.dataset.wohn || t.dataset.int) {
    if (app.demo) { toast('In den Beispieldaten nicht änderbar.'); return; }
    if (t.dataset.pers) commit({ ...s, profil: { ...s.profil, personen: +t.dataset.pers } });
    if (t.dataset.wohn) commit({ ...s, profil: { ...s.profil, wohnform: t.dataset.wohn } });
    if (t.dataset.int) commit({ ...s, erinnerung: { intervall: t.dataset.int } });
    return;
  }
  if (t.dataset.themeSet) { store.setPref('theme', t.dataset.themeSet); applyTheme(); render(); return; }
  const act = t.dataset.act;
  if (act === 'read') openEntry();
  else if (act === 'close-entry') $('entrySheet').close();
  else if (act === 'close-contract') $('contractDlg').close();
  else if (act === 'help') openGuide('help', 0);
  else if (act === 'close-guide') { if (guide.mode === 'setup' && !app.demo && !store.load()) { app.demo = true; app.state = sampleState(); app.period = null; render(); } $('guide').close(); }
  else if (act === 'setup') openGuide('setup', 1);
  else if (act === 'import') { $('fileIn').value = ''; $('fileIn').click(); }
  else if (act === 'edit') openEntry(t.dataset.d);
  else if (act === 'del') { app.confirmDel = t.dataset.d; render(); }
  else if (act === 'del-no') { app.confirmDel = null; render(); }
  else if (act === 'del-yes') { app.confirmDel = null; commit({ ...s, readings: s.readings.filter(r => r.datum !== t.dataset.d) }, 'Ablesung gelöscht'); }
  else if (act === 'edit-contract') openContract(t.dataset.id);
  else if (act === 'new-contract') openContract();
  else if (act === 'ck-toggle') { app.ckOpen = app.ckOpen === t.dataset.id ? null : t.dataset.id; render(); }
  else if (act === 'check') {
    if (app.demo) { toast('In den Beispieldaten nicht änderbar.'); return; }
    const k = t.dataset.k;
    const vertraege = s.vertraege.map(c => { if (c.id !== t.dataset.id) return c; const checks = { ...c.checks }; const which = k === 'sofortbonus' ? 'sofort' : k === 'neubonus' ? 'neukunde' : null; const wasDone = !!checks[k] || !!(which && c.bonus[which].erhalten); if (wasDone) delete checks[k]; else checks[k] = todayStr(); const bonus = which ? { ...c.bonus, [which]: { ...c.bonus[which], erhalten: wasDone ? null : todayStr() } } : c.bonus; return { ...c, checks, bonus }; });
    commit({ ...s, vertraege });
  }
  else if (act === 'copy') { const v = t.dataset.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Kopiert'), () => toast(v)); }
  else if (act === 'backup') doBackup();
  else if (act === 'share') doShare();
  else if (act === 'csv') downloadFile(`zaehlerbuch-${todayStr()}.csv`, '﻿Datum;Zählerstand (kWh)\r\n' + s.readings.map(r => `${fmtD(r.datum)};${String(r.stand).replace('.', ',')}`).join('\r\n') + '\r\n', 'text/csv');
  else if (act === 'ics') { downloadFile('zaehler-ablesen.ics', icsReading(), 'text/calendar'); toast('Kalenderdatei geladen. Öffne sie zum Eintragen.'); }
  else if (act === 'ics-kuendigung') { const c = s.vertraege.find(x => x.id === t.dataset.id); downloadFile('kuendigungsfrist.ics', icsKuendigung(c), 'text/calendar'); toast('Frist als Kalenderdatei geladen'); }
  else if (act === 'goal-suggest') { if (app.demo) return; commit({ ...s, ziel: { kwh: +t.dataset.v } }, 'Sparziel gesetzt'); }
  else if (act === 'goto-goal') { app.tab = 'einstellungen'; render(); setTimeout(() => { $('goalSettings').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('stZiel').focus({ preventScroll: true }); }, 50); }
  else if (act === 'reset') $('resetZone').innerHTML = `<div class="confirm"><span>Wirklich alle Daten von diesem Gerät löschen?</span><span class="btns"><button class="btn danger sm" type="button" data-act="reset-yes">Ja, löschen</button><button class="btn sm" type="button" data-act="reset-no">Abbrechen</button></span></div>`;
  else if (act === 'reset-no') render();
  else if (act === 'reset-yes') { store.clear(); store.setPref('onboarded', false); app.state = sampleState(); app.demo = true; app.period = null; app.tab = 'home'; render(); guide.draft = {}; openGuide('setup', 0); }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.card[data-goto]')) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener('change', ev => {
  const inp = ev.target, s = app.state;
  if (inp.id === 'fileIn') { const f = inp.files[0]; if (f) importFile(f); return; }
  if (!inp.closest('[data-panel="einstellungen"]')) return;
  if (app.demo) { toast('In den Beispieldaten nicht änderbar.'); render(); return; }
  const k = inp.dataset.set;
  if (k === 'name') return commit({ ...s, profil: { ...s.profil, name: inp.value.trim().slice(0, 40) } }, 'Gespeichert');
  if (k === 'co2') { const v = parseNum(inp.value); if (isFinite(v) && v >= 0) return commit({ ...s, profil: { ...s.profil, co2: v } }, 'Gespeichert'); return toast('Bitte eine Zahl eintragen.'); }
  if (k === 'ziel') { const v = inp.value.trim() ? parseNum(inp.value) : null; if (v === null || (isFinite(v) && v > 0)) return commit({ ...s, ziel: { kwh: v } }, v ? 'Sparziel gespeichert' : 'Sparziel entfernt'); return toast('Bitte eine Zahl in kWh eintragen.'); }
});
function applyTheme() { const t = store.prefs().theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
let rz;
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (app.state && (app.tab === 'verlauf' || app.tab === 'statistik')) { app.lastTab = app.tab; render(); } }, 150); }).observe(document.querySelector('main'));
document.addEventListener('visibilitychange', () => { if (!document.hidden && app.state) renderHeader(); });

// ================= Start =================
(function boot() {
  applyTheme();
  const saved = store.load();
  if (saved) { app.state = saved; app.demo = false; store.save(saved); }
  else { app.state = sampleState(); app.demo = true; }
  render();
  if (!saved && !store.prefs().onboarded) openGuide('setup', 0);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
